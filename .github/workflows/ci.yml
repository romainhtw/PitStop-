name: CI

# Runs before every merge. This project auto-deploys from master, so a green
# run here is what stands between a bad commit and an App Store merchant.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build must not need real credentials. If this step starts failing
          # for want of a secret, that is the bug — not a reason to add one here.
          NEXT_TELEMETRY_DISABLED: "1"
